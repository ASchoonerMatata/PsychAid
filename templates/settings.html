{% extends "base.html" %}
{% block title %}Settings — PsychAid{% endblock %}

{% block content %}
<div class="page">
  <div class="section-card">
    <div class="section-title">
      <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </div>

    <div
      class="settings-form"
      id="settings-form"
      data-settings='{{ settings | tojson }}'
      data-providers='{{ provider_options | tojson }}'
    >
      <div class="field-group">
        <label for="provider">AI Provider</label>
        <select id="provider">
          {% for name, provider in provider_options.items() %}
          <option value="{{ name }}" {% if settings.provider == name %}selected{% endif %}>{{ provider.label }}</option>
          {% endfor %}
        </select>
      </div>

      <fieldset class="auth-options">
        <legend>Authentication</legend>
        <label class="radio-card">
          <input type="radio" name="auth-mode" value="api_key" {% if settings.auth_mode == 'api_key' %}checked{% endif %}>
          <span>
            <strong>Use my API key</strong>
            <small>Store a key on this device.</small>
          </span>
        </label>
        <label class="radio-card">
          <input type="radio" name="auth-mode" value="subscription" {% if settings.auth_mode == 'subscription' %}checked{% endif %}>
          <span>
            <strong>Use a subscription / environment credential</strong>
            <small id="subscription-help">Use a credential already configured on this computer.</small>
          </span>
        </label>
      </fieldset>

      <div class="field-group" id="api-key-group">
        <label for="api-key">New API Key</label>
        <input type="password" id="api-key" placeholder="Enter a new key" autocomplete="new-password">
        <div class="credential-note">
          <span class="key-status" id="key-status"></span>
          <span>Leave blank to keep the saved key unchanged.</span>
        </div>
      </div>

      <div class="field-group">
        <label for="model">Model Override <span class="optional">Optional</span></label>
        <input type="text" id="model" value="{{ settings.model }}" autocomplete="off">
        <p class="field-help">Leave blank to use <strong id="default-model"></strong>.</p>
      </div>

      <div class="settings-actions">
        <button class="btn btn-save" id="save-settings-btn" onclick="saveSettings()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Settings
        </button>
        <button class="btn btn-secondary" id="test-provider-btn" onclick="testProvider()">
          <span class="button-spinner"></span>
          <svg class="test-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <span>Test connection</span>
        </button>
      </div>
      <p class="test-note">Connection tests use the currently saved settings.</p>
    </div>
  </div>
</div>
{% endblock %}
