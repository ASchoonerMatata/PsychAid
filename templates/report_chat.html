{% extends "base.html" %}
{% block title %}Report Chat — PsychAid{% endblock %}

{% block content %}
<style>
.chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 120px); max-width:860px; margin:0 auto; padding:0 16px; }
.chat-header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
.chat-header h2 { font-size:1rem; font-weight:600; color:var(--navy); }
.btn-export { background:var(--teal); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:.85rem; font-weight:600; cursor:pointer; display:none; }
.btn-export:hover { opacity:.88; }
.btn-export.visible { display:inline-block; }
.chat-messages { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:14px; }
.msg { display:flex; gap:10px; align-items:flex-start; }
.msg.user { flex-direction:row-reverse; }
.avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:2px; }
.av-ai { background:var(--navy); color:#fff; }
.av-user { background:var(--teal); color:#fff; }
.bubble { max-width:80%; padding:10px 14px; border-radius:12px; font-size:.88rem; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.bubble.ai { background:#f0f4f9; color:#1a2d4f; border-radius:4px 12px 12px 12px; }
.bubble.user { background:var(--teal); color:#fff; border-radius:12px 4px 12px 12px; }
.bubble.error { background:#fde8e8; color:#8b1c1c; }
.typing-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#94a3b8; margin:0 2px; animation:blink 1.2s infinite; }
.typing-dot:nth-child(2){animation-delay:.2s} .typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chat-footer { flex-shrink:0; padding:10px 0 14px; border-top:1px solid var(--border); }
.upload-panel { background:#f8fafc; border:1.5px dashed var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
.upload-panel.hidden { display:none; }
.upload-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.upload-row input[type=text] { flex:1; min-width:160px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:.85rem; }
.upload-row label.file-btn { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:.85rem; cursor:pointer; color:var(--navy); white-space:nowrap; }
.upload-row label.file-btn:hover { background:#f0f4f9; }
.upload-row input[type=file] { display:none; }
.file-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { background:#e4e8ef; color:#1a2d4f; border-radius:20px; padding:3px 10px; font-size:.78rem; display:flex; align-items:center; gap:5px; }
.chip button { background:none; border:none; cursor:pointer; color:#64748b; font-size:13px; line-height:1; padding:0; }
.btn-start { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:9px 20px; font-size:.85rem; font-weight:600; cursor:pointer; white-space:nowrap; }
.btn-start:hover { opacity:.88; }
.btn-start:disabled { opacity:.45; cursor:not-allowed; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.input-row textarea { flex:1; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:.88rem; resize:none; min-height:42px; max-height:120px; line-height:1.5; font-family:inherit; overflow-y:auto; }
.input-row textarea:focus { outline:none; border-color:var(--teal); }
.input-row textarea:disabled { background:#f1f5f9; }
.btn-send { background:var(--teal); color:#fff; border:none; border-radius:9px; padding:10px 18px; font-size:.9rem; cursor:pointer; flex-shrink:0; }
.btn-send:hover { opacity:.88; }
.btn-send:disabled { opacity:.4; cursor:not-allowed; }
</style>

<div class="chat-wrap">
  <div class="chat-header">
    <h2>Interactive Report</h2>
    <button class="btn-export" id="export-btn" onclick="exportReport()">Download Report (.docx)</button>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="msg">
      <div class="avatar av-ai">PA</div>
      <div class="bubble ai">Upload the client's documents below and click Start to begin the interactive report workflow.</div>
    </div>
  </div>

  <div class="chat-footer">
    <div class="upload-panel" id="upload-panel">
      <div class="upload-row">
        <input type="text" id="client-name" placeholder="Client name (optional)">
        <label class="file-btn" for="file-input">+ Add files</label>
        <input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.txt" onchange="addFiles(this.files)">
        <button class="btn-start" id="start-btn" onclick="startReport()">Start Report</button>
      </div>
      <div class="file-chips" id="file-chips"></div>
    </div>

    <div class="input-row">
      <textarea id="msg-input" placeholder="Type your response…" rows="1" disabled
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="btn-send" id="send-btn" onclick="sendMessage()" disabled>↑</button>
    </div>
  </div>
</div>

<script>
let sessionId = null;
let fileList = [];

// Report is complete when it contains these markers
const COMPLETE_MARKERS = ['Report Completed By', 'Strength-Based Approach', 'REPORT COMPLETE'];
const MAX_AUTO_CONTINUE = 6;

function isReportComplete(text) {
  return COMPLETE_MARKERS.some(m => text.includes(m));
}

function addFiles(files) {
  for (const f of files) {
    if (!fileList.find(x => x.name === f.name)) fileList.push(f);
  }
  renderChips();
}

function renderChips() {
  const el = document.getElementById('file-chips');
  el.innerHTML = fileList.map((f, i) =>
    `<span class="chip">📄 ${f.name} <button onclick="removeFile(${i})">✕</button></span>`
  ).join('');
}

function removeFile(i) { fileList.splice(i, 1); renderChips(); }

function appendMsg(role, text) {
  const feed = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg${role === 'user' ? ' user' : ''}`;
  const av = document.createElement('div');
  av.className = `avatar ${role === 'user' ? 'av-user' : 'av-ai'}`;
  av.textContent = role === 'user' ? 'You' : 'PA';
  const bub = document.createElement('div');
  bub.className = `bubble ${role === 'user' ? 'user' : role === 'error' ? 'error' : 'ai'}`;
  bub.textContent = text;
  div.appendChild(av); div.appendChild(bub);
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  return bub;
}

function showTyping(label) {
  const feed = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg'; div.id = 'typing-indicator';
  const lbl = label ? `<span style="font-size:.78rem;color:#64748b;margin-left:4px">${label}</span>` : '';
  div.innerHTML = `<div class="avatar av-ai">PA</div><div class="bubble ai"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>${lbl}</div>`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function setInputEnabled(enabled) {
  document.getElementById('msg-input').disabled = !enabled;
  document.getElementById('send-btn').disabled = !enabled;
  if (enabled) document.getElementById('msg-input').focus();
}

async function startReport() {
  if (fileList.length === 0) { alert('Please add at least one document.'); return; }
  const btn = document.getElementById('start-btn');
  btn.disabled = true; btn.textContent = 'Generating…';
  document.getElementById('upload-panel').classList.add('hidden');

  const fd = new FormData();
  fd.append('client_name', document.getElementById('client-name').value);
  fileList.forEach(f => fd.append('files', f));

  showTyping('Drafting report…');
  try {
    const res = await fetch('/api/report/start', { method: 'POST', body: fd });
    const data = await res.json();
    hideTyping();
    if (data.error) {
      appendMsg('error', '⚠ ' + data.error);
      document.getElementById('upload-panel').classList.remove('hidden');
      btn.disabled=false; btn.textContent='Start Report';
      return;
    }
    sessionId = data.session_id;
    appendMsg('ai', data.message);
    let accumulated = data.message;

    // Auto-continue until report is complete (up to MAX_AUTO_CONTINUE times)
    let autoCount = 0;
    while (!isReportComplete(accumulated) && autoCount < MAX_AUTO_CONTINUE) {
      autoCount++;
      const section = autoCount === 1 ? 'Continuing report…' :
                      autoCount === 2 ? 'Adding results…' :
                      autoCount === 3 ? 'Writing recommendations…' :
                      'Finishing up…';
      showTyping(section);
      try {
        const r2 = await fetch('/api/report/message', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({session_id: sessionId, message: 'continue'})
        });
        const d2 = await r2.json();
        hideTyping();
        if (d2.error) break;
        appendMsg('ai', d2.message);
        accumulated += '\n\n' + d2.message;
      } catch(e) { hideTyping(); break; }
    }

    setInputEnabled(true);
    document.getElementById('export-btn').classList.add('visible');
  } catch(e) {
    hideTyping();
    appendMsg('error', 'Connection error. Please try again.');
    document.getElementById('upload-panel').classList.remove('hidden');
    btn.disabled=false; btn.textContent='Start Report';
  }
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !sessionId) return;
  input.value = ''; input.style.height = 'auto';
  appendMsg('user', text);
  setInputEnabled(false);
  showTyping();
  try {
    const res = await fetch('/api/report/message', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, message: text})
    });
    const data = await res.json();
    hideTyping();
    if (data.error) { appendMsg('error', '⚠ ' + data.error); }
    else { appendMsg('ai', data.message); }
  } catch(e) {
    hideTyping();
    appendMsg('error', 'Connection error. Please try again.');
  }
  setInputEnabled(true);
}

async function exportReport() {
  if (!sessionId) return;
  const btn = document.getElementById('export-btn');
  btn.textContent = 'Compiling…'; btn.disabled = true;
  showTyping();

  // Try pywebview native download first (Mac app), fall back to browser
  if (window.pywebview && window.pywebview.api && window.pywebview.api.download_report) {
    hideTyping();
    const r = await window.pywebview.api.download_report(sessionId);
    if (r && r.success) showToast('Report saved!', 'success');
    else if (r && r.error) showToast(r.error, 'error');
  } else {
    try {
      const res = await fetch('/api/report/export', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sessionId})
      });
      hideTyping();
      if (!res.ok) { const j = await res.json().catch(()=>{}); showToast(j?.error || 'Export failed', 'error'); }
      else {
        const blob = await res.blob();
        const cd = res.headers.get('Content-Disposition') || '';
        const m = cd.match(/filename[^;=\n]*=["']?([^"';\n]+)/);
        const fname = m ? m[1] : 'PsychAid_Report.docx';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=fname; a.click();
        URL.revokeObjectURL(url);
        showToast('Report downloaded!', 'success');
      }
    } catch(e) {
      hideTyping();
      showToast('Export failed. Please try again.', 'error');
    }
  }
  btn.textContent = 'Download Report (.docx)'; btn.disabled = false;
}

function showToast(msg, type='info') {
  let t = document.getElementById('toast');
  if (!t) { t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className=`toast ${type}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),4000);
}
</script>
{% endblock %}
