name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pywebview flask anthropic pillow reportlab python-docx mammoth pypdf

      - name: Build Mac app
        run: |
          pyinstaller \
            --name PsychAid \
            --windowed \
            --onedir \
            --icon AppIcon.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "skill:skill" \
            --hidden-import anthropic \
            --hidden-import flask \
            --hidden-import webview \
            --collect-all webview \
            main.py

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "PsychAid" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PsychAid.app" 175 190 \
            --app-drop-link 425 190 \
            "PsychAid-Mac.dmg" \
            "dist/"

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: PsychAid-Mac.dmg
          draft: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller "pywebview>=4.0" pythonnet flask anthropic pillow reportlab python-docx mammoth pypdf

      - name: Build Windows exe
        run: |
          pyinstaller `
            --name PsychAid `
            --windowed `
            --onedir `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "skill;skill" `
            --hidden-import anthropic `
            --hidden-import flask `
            --hidden-import webview `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import webview.platforms.winforms `
            --collect-all webview `
            main.py

      - name: Zip Windows build
        run: Compress-Archive -Path dist\PsychAid -DestinationPath PsychAid-Windows.zip

      - name: Upload Windows zip
        uses: softprops/action-gh-release@v2
        with:
          files: PsychAid-Windows.zip
          draft: false
