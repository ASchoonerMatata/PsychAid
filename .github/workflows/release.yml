name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      # Intel Macs dropped: macos-13 runners queue for hours. Apple Silicon is the shipped Mac target.
      matrix:
        include:
          - os: windows-latest
            asset: PsychAid-windows-x64-setup.exe
          - os: macos-14
            asset: PsychAid-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt pyinstaller

      # PyInstaller 6 accepts the ':' data separator on every platform.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --name PsychAid \
            --add-data "templates:templates" --add-data "static:static" \
            --collect-all webview \
            main.py
          ./dist/PsychAid/PsychAid.exe --selftest
          curl -L -o installer/MicrosoftEdgeWebview2Setup.exe https://go.microsoft.com/fwlink/p/?LinkId=2124703
          choco install innosetup -y --no-progress
          # MSYS2_ARG_CONV_EXCL stops Git Bash rewriting /D and /O into Windows paths
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DMyAppVersion=${GITHUB_REF_NAME#v} /O. installer/psychaid.iss

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name PsychAid \
            --osx-bundle-identifier com.psychaid.app \
            --add-data "templates:templates" --add-data "static:static" \
            --collect-all webview \
            main.py
          ./dist/PsychAid.app/Contents/MacOS/PsychAid --selftest
          mkdir -p dmg-stage
          cp -R dist/PsychAid.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname PsychAid -srcfolder dmg-stage \
            -ov -format UDZO "${{ matrix.asset }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
